<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="新境盒改枪码平台 - 分享你的专属武器配置，发现最热门的改枪方案">
  <link rel="icon" href="/logo/NexBoxW.png" type="image/png">
  <link rel="shortcut icon" href="logo/NexBoxW.png" type="image/png">
  <title>新境盒改枪码平台</title>
  <link rel="stylesheet" href="style.2.css">
</head>
<body>
  <div class="layout">
    <!-- ░░ 左侧导航 ░░ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="logo/NexBoxW.png" alt="NexBox" class="logo-img" />
          <span>新境盒改枪码</span>
        </div>
      </div>

      <div class="sidebar-search">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索武器或改枪码..." />
      </div>

      <nav class="sidebar-nav" id="categoryNav">
        <div class="nav-section-label">武器分类</div>
        <!-- 由 JS 动态渲染 -->
      </nav>

      <div class="sidebar-actions">
        <button class="upload-btn" id="uploadBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          上传改枪码
        </button>
        <a href="admin.html" class="admin-link" target="_blank">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          管理后台
        </a>
      </div>

      <div class="sidebar-footer">
        <a href="https://www.nexbox.top" class="back-link" target="_blank">← 返回新境盒官网</a>
      </div>
    </aside>

    <!-- ░░ 右侧内容区 ░░ -->
    <main class="main-content">
      <!-- 顶部栏 -->
      <header class="content-header" id="contentHeader">
        <div class="content-header-left">
          <button class="menu-toggle" id="menuToggle" onclick="toggleMenu()" aria-label="打开菜单">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div>
            <h1 class="content-title" id="currentCategory">全部分类</h1>
            <span class="content-count" id="loadoutCount">加载中...</span>
          </div>
        </div>
      </header>

      <!-- 改枪码卡片列表 -->
      <div class="loadout-list" id="loadoutList">
        <div class="loading-spinner"></div>
      </div>
    </main>
  </div>

  <!-- ░░ 上传弹窗 ░░ -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal-box">
      <div class="modal-header">
        <h2>上传改枪码</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>武器分类 *</label>
          <select id="formCategory" class="form-select" onchange="onCategoryChange()"></select>
        </div>
        <div class="form-group">
          <label>武器名称 *</label>
          <select id="formWeapon" class="form-select"><option value="">请先选择分类</option></select>
        </div>
        <div class="form-group">
          <label>改枪码 *</label>
          <textarea id="formCode" class="form-textarea" rows="3" placeholder="粘贴你的改枪码..." maxlength="500"></textarea>
        </div>
        <div class="form-group">
          <label>描述（可选）</label>
          <input type="text" id="formDesc" class="form-input" placeholder="配置特点、适用场景..." maxlength="200" />
        </div>
        <div class="form-group">
          <label>改枪费用 *</label>
          <input type="number" id="formCost" class="form-input" placeholder="此次改枪花费" min="0" required />
        </div>
        <div class="form-group">
          <label>昵称（可选）</label>
          <input type="text" id="formAuthor" class="form-input" placeholder="匿名" maxlength="20" />
        </div>
        <div class="form-error" id="formError"></div>
        <div class="form-success" id="formSuccess">提交成功！改枪码已进入审核队列。</div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="modalCancel">取消</button>
        <button class="btn-submit" id="formSubmit">提交改枪码</button>
      </div>
    </div>
  </div>

  <!-- ░░ 移动端遮罩 ░░ -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ░░ Toast ░░ -->
  <div class="toast" id="toast"></div>

  <script>
  (function(){
    var menu = document.getElementById('menuToggle'), sidebar = document.getElementById('sidebar'), overlay = document.getElementById('sidebarOverlay');
    if (!menu || !sidebar || !overlay) return;
    function applyPos() {
      var isMobile = window.innerWidth <= 768;
      sidebar.style.position = isMobile ? 'fixed' : '';
      sidebar.style.left = isMobile ? '0' : '';
      sidebar.style.top = isMobile ? '0' : '';
      sidebar.style.bottom = isMobile ? '0' : '';
      sidebar.style.zIndex = isMobile ? '20' : '';
      sidebar.style.transition = isMobile ? 'transform 0.3s ease' : '';
      sidebar.style.boxShadow = isMobile ? '4px 0 24px rgba(0,0,0,0.08)' : '';
      sidebar.style.transform = isMobile && !sidebar.classList.contains('open') ? 'translateX(-100%)' : isMobile ? 'translateX(0)' : '';
      overlay.style.display = isMobile && sidebar.classList.contains('open') ? 'block' : 'none';
      overlay.style.opacity = isMobile && sidebar.classList.contains('open') ? '1' : '';
      document.body.style.overflow = isMobile && sidebar.classList.contains('open') ? 'hidden' : '';
    }
    menu.addEventListener('click', function(){
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
      applyPos();
    });
    overlay.addEventListener('click', function(){
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
      applyPos();
    });
    window.addEventListener('resize', applyPos);
    applyPos();
    document.addEventListener('click', function(e) {
      if (window.innerWidth > 768) return;
      var el = e.target.closest('.nav-sub-item, .upload-btn');
      if (el) { sidebar.classList.remove('open'); overlay.classList.remove('open'); applyPos(); }
    });
  })();
  </script>

  <script src="app.2.js?v=2"></script>
</body>
</html>
