<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo/NexBoxW.png" type="image/png">
  <link rel="shortcut icon" href="/logo/NexBoxW.png" type="image/png">
  <title>改枪码管理后台</title>
  <link rel="stylesheet" href="style.css?v=2.0">
  <script>document.documentElement.style.setProperty('--css-v', '"2.0"');</script>
  <style>
    body { height: auto; min-height: 100vh; }
    .admin-wrap { max-width: 98vw; margin: 0 auto; padding: 2rem; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .admin-header h1 { font-size: 1.4rem; font-weight: 700; }
    .admin-header .sub { font-size: 0.8rem; color: var(--text-3); margin-top: 0.25rem; }
    .admin-actions { display: flex; gap: 0.75rem; align-items: center; }
    
    .auth-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
    }
    .auth-box {
      background: white; border-radius: var(--radius-lg);
      padding: 2.5rem; width: 100%; max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    }
    .auth-box h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
    .auth-box p { font-size: 0.85rem; color: var(--text-3); margin-bottom: 1.5rem; }
    
    .filter-bar { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; align-items: center; }
    .filter-bar .filter-btn {
      padding: 0.45rem 1rem; border: 1px solid rgba(0,0,0,0.08);
      background: white; border-radius: 8px; font-family: inherit;
      font-size: 0.8rem; font-weight: 600; color: var(--text-2);
      cursor: pointer; transition: all 0.15s;
    }
    .filter-bar .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .filter-bar .filter-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
    .filter-bar .stat-badge { margin-left: auto; font-size: 0.8rem; color: var(--text-3); }
    
    .admin-table { width: 100%; border-collapse: collapse; background: white; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--glass-shadow); }
    .admin-table thead th {
      font-size: 0.72rem; letter-spacing: 0.1em; color: var(--text-3);
      text-transform: uppercase; padding: 0.85rem 1rem; text-align: left;
      background: rgba(0,0,0,0.02); border-bottom: 1px solid rgba(0,0,0,0.06);
      font-weight: 600;
    }
    .admin-table tbody td { padding: 0.75rem 1rem; font-size: 0.85rem; border-bottom: 1px solid rgba(0,0,0,0.04); vertical-align: middle; }
    .admin-table tbody tr:hover { background: rgba(37,99,235,0.02); }
    .admin-table .code-cell { font-family: monospace; font-size: 0.78rem; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .admin-table .weapon-cell { font-weight: 600; }
    
    .status-badge {
      display: inline-flex; padding: 0.15rem 0.55rem; border-radius: 6px;
      font-size: 0.72rem; font-weight: 600;
    }
    .status-badge.approved { background: rgba(16,185,129,0.1); color: #10B981; }
    .status-badge.pending { background: rgba(245,158,11,0.1); color: #F59E0B; }
    .status-badge.rejected { background: rgba(239,68,68,0.1); color: #EF4444; }
    
    .action-btn {
      padding: 0.3rem 0.65rem; border-radius: 6px; border: none;
      font-family: inherit; font-size: 0.72rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s; margin: 0 0.15rem;
    }
    .action-btn.approve { background: rgba(16,185,129,0.1); color: #10B981; }
    .action-btn.approve:hover { background: #10B981; color: white; }
    .action-btn.reject { background: rgba(239,68,68,0.1); color: #EF4444; }
    .action-btn.reject:hover { background: #EF4444; color: white; }
    .action-btn.delete { background: rgba(0,0,0,0.04); color: var(--text-3); }
    .action-btn.delete:hover { background: #EF4444; color: white; }
    
    .logout-btn {
      padding: 0.45rem 1rem; border: 1px solid rgba(0,0,0,0.08);
      background: white; border-radius: 8px; font-family: inherit;
      font-size: 0.8rem; font-weight: 600; color: var(--text-2);
      cursor: pointer;
    }
    .logout-btn:hover { border-color: #EF4444; color: #EF4444; }

    .edit-input {
      padding: 0.3rem 0.5rem; border: 1px solid var(--accent);
      border-radius: 6px; font-family: inherit; font-size: 0.8rem;
      outline: none; width: 100%; box-sizing: border-box;
      background: rgba(37,99,235,0.03);
    }
    .edit-input:focus { border-color: #2563EB; box-shadow: 0 0 0 2px rgba(37,99,235,0.15); }
    .edit-cost { width: 80px !important; }
    .editing-row td { background: rgba(37,99,235,0.03); }
    .edit-btn { background: rgba(99,102,241,0.1); color: #6366F1; }
    .edit-btn:hover { background: #6366F1; color: white; }

    .reported-reported { background: rgba(239,68,68,0.1); color: #EF4444; }
    .reported-clear { background: rgba(16,185,129,0.08); color: #10B981; }
    .clear-report-btn { background: rgba(245,158,11,0.12); color: #D97706; }
    .clear-report-btn:hover { background: #D97706; color: white; }

    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--text-1); color: white; padding: 0.7rem 1.5rem; border-radius: 12px; font-size: 0.85rem; font-weight: 500; box-shadow: 0 8px 32px rgba(0,0,0,0.2); opacity: 0; transition: all 0.3s ease; z-index: 2000; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    
    .loading { text-align: center; padding: 4rem; color: var(--text-3); }

    .cat-filter-bar, .weapon-filter-bar {
      display: flex; gap: 0.4rem; margin-bottom: 0.9rem; flex-wrap: wrap;
    }
    .cat-filter-bar { margin-top: -0.5rem; }
    .cat-btn, .weapon-btn {
      padding: 0.35rem 0.85rem; border: 1px solid rgba(0,0,0,0.08);
      background: white; border-radius: 7px; font-family: inherit;
      font-size: 0.78rem; font-weight: 600; color: var(--text-2);
      cursor: pointer; transition: all 0.15s;
    }
    .cat-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .cat-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
    .weapon-btn.active { background: #6366F1; color: white; border-color: #6366F1; }
    .weapon-btn:hover:not(.active) { border-color: #6366F1; color: #6366F1; }
  </style>
</head>
<body>
  <!-- 登录界面 -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-box">
      <h2>管理后台</h2>
      <p>请输入管理员账号以管理改枪码</p>
      <div class="form-group">
        <label>用户名</label>
        <input type="text" class="form-input" id="loginUser" placeholder="输入用户名" />
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" class="form-input" id="loginPass" placeholder="输入密码" />
      </div>
      <div class="form-error" id="loginError"></div>
      <button class="btn-submit" style="width:100%" id="loginBtn">登录</button>
    </div>
  </div>

  <!-- 管理界面 -->
  <div class="admin-wrap" id="adminPanel" style="display:none">
    <div class="admin-header">
      <div>
        <h1>改枪码管理</h1>
        <div class="sub" style="font-size:1.1rem;font-weight:500">当前管理员：<strong id="currentAdmin">-</strong></div>
      </div>
      <div class="admin-actions">
        <button class="logout-btn" id="logoutBtn">退出登录</button>
        <a href="index.html" class="admin-link" target="_blank">← 返回前台</a>
      </div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="pending">待审核</button>
      <button class="filter-btn" data-filter="approved">已通过</button>
      <button class="filter-btn" data-filter="rejected">已拒绝</button>
      <span class="stat-badge" id="statBadge">加载中...</span>
    </div>

    <div class="cat-filter-bar" id="catFilterBar">
      <button class="cat-btn active" data-cat="all">全部分类</button>
    </div>
    <div class="weapon-filter-bar" id="weaponFilterBar" style="display:none">
      <button class="weapon-btn active" data-weapon="">全部武器</button>
    </div>

    <table class="admin-table">
      <thead>
        <tr>
          <th>武器</th>
          <th>分类</th>
          <th>改枪码</th>
          <th>上传者</th>
          <th>点赞</th>
          <th>费用</th>
          <th>无法使用</th>
          <th>状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="adminTbody">
        <tr><td colspan="8" class="loading">加载中...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="toast" id="adminToast"></div>

  <script src="admin.js?v=1.0"></script>
</body>
</html>
